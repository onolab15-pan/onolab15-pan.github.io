.back{transform:rotateY(180deg);padding:25px 26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center}
.answer-heading{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:10px}
.number{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--red);color:white;font-weight:700;font-size:17px}
.answer-label{margin:0;color:var(--muted);font-size:14px}
h2{font-size:30px;line-height:1.4;letter-spacing:.08em;margin:8px 0 4px;color:#172b34}

.hint{text-align:center;margin:23px 0 16px;font-size:16px;color:var(--muted)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--red);outline-offset:4px}
footer{border-top:1px solid #cdd8dd;padding-top:16px;display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:12px}

</script><script>(() => {
  const cards = window.SUSHI_CARDS;
  const card = document.getElementById('card');
  const front = document.getElementById('front');
  const back = document.getElementById('back');
  let index = 0;
  let flipped = false;
  const player = new Audio();
  player.preload = 'auto';
  const audioButtons = document.getElementById('audio-buttons');
  const audioStatus = document.getElementById('audio-status');
  let audioRun = 0;
  function stopAudio() { audioRun++; player.pause(); player.currentTime = 0; audioStatus.textContent = ''; }
  const audioLoads = new Map();
  function loadAudio(id) {
    const group = Math.floor((Number(id) - 1) / 10) + 1;
    if (!audioLoads.has(group)) audioLoads.set(group, new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `play/sushi-audio/audio-${group}.js`;
      script.onload = resolve;
      script.onerror = () => {audioLoads.delete(group); script.remove(); reject(new Error('Audio unavailable'));};
      document.head.append(script);
    }));
    return audioLoads.get(group);
  }
  async function playAudio(language) {
    stopAudio();
    const run = audioRun;
    const id = cards[index].id;
    try { if (language === 'ja') await loadAudio(id); } catch (_) {
      if (run === audioRun) audioStatus.textContent = 'Unable to load audio. Please try again.';
      return;
    }
    if (run !== audioRun) return;
    const src = language === 'en' ? cards[index].audioEn : window.SUSHI_AUDIO?.[id]?.ja;
    if (!src) return;
    if (player.getAttribute('src') !== src) player.src = src;
    player.play().then(() => { if (run === audioRun) audioStatus.textContent = language === 'ja' ? 'Playing Japanese…' : 'Playing English…'; }).catch(() => { if (run === audioRun) audioStatus.textContent = 'Unable to play audio. Tap the audio button to try again.'; });
  }
  player.addEventListener('ended', () => { audioStatus.textContent = ''; });
  player.addEventListener('error', () => { audioStatus.textContent = 'Unable to load audio.'; });
  document.getElementById('play-ja').addEventListener('click', () => playAudio('ja'));
  document.getElementById('play-en').addEventListener('click', () => playAudio('en'));
  window.addEventListener('pagehide', stopAudio);

  function updateFace() {
    audioButtons.hidden = !flipped || !(cards[index].audioJa || cards[index].audioEn);
    document.getElementById('play-ja').hidden = !cards[index].audioJa;
    document.getElementById('play-en').hidden = !cards[index].audioEn;
    card.classList.toggle('flipped', flipped);
    card.setAttribute('aria-pressed', String(flipped));
    card.setAttribute('aria-label', flipped ? `${cards[index].nameJa}、${cards[index].nameEn}。Flip the card back to the photo` : 'Flip the card to reveal the answer');
    front.setAttribute('aria-hidden', String(flipped));
    back.setAttribute('aria-hidden', String(!flipped));
    front.inert = flipped; back.inert = !flipped;
    document.getElementById('hint').textContent = flipped ? 'Tap again to return to the photo' : 'Tap the photo to reveal the answer';
  }
  function twoLineDescription(text, language) {
    const value = text.trim();
    if (!value || value.includes('\n')) return value;
    let boundaries = [];
    if (language === 'en') {
      for (const match of value.matchAll(/\s+/g)) boundaries.push(match.index);
    } else if (typeof Intl.Segmenter === 'function') {
      const segments = new Intl.Segmenter('ja', {granularity:'word'}).segment(value);
      for (const segment of segments) {
        const end = segment.index + segment.segment.length;
        if (end < value.length && !/^[、。！？）]/.test(value.slice(end))) boundaries.push(end);
      }
    } else {
      boundaries = Array.from({length:value.length - 1}, (_, i) => i + 1)
        .filter(position => !/^[、。！？）]/.test(value.slice(position)));
    }
    if (!boundaries.length) return value;
    const middle = value.length / 2;
    const split = boundaries.reduce((best, current) =>
      (Math.abs(current - middle) - (/[,.]$/.test(value.slice(0, current)) ? 2 : 0)) <
      (Math.abs(best - middle) - (/[,.]$/.test(value.slice(0, best)) ? 2 : 0)) ? current : best);
    return value.slice(0, split).trimEnd() + '\n' + value.slice(split).trimStart();
  }
  function render() {
    stopAudio();
    const data = cards[index];
    loadAudio(data.id).catch(() => {});
    const inner = card.querySelector('.card-inner');
    inner.style.transition = 'none';
    flipped = false;
    updateFace();
    void inner.offsetWidth;
    inner.style.transition = '';
    document.getElementById('photo').src = data.photo;
    document.getElementById('ingredient').src = data.ingredientImage;
    document.getElementById('number').textContent = data.id;
    for (const [id, key] of [['name-ja','nameJa'], ['name-en','nameEn'], ['description-ja','descriptionJa'], ['description-en','descriptionEn']]) {
      document.getElementById(id).textContent = id.startsWith('description-')
        ? twoLineDescription(data[key], id.endsWith('-en') ? 'en' : 'ja') : data[key];
    }
    document.getElementById('count').textContent = `${String(index + 1).padStart(2, '0')} / ${String(cards.length).padStart(2, '0')}`;
    updateFace();
  }
  function flip() { stopAudio(); flipped = !flipped; updateFace(); }
  card.addEventListener('click', flip);
  card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); if (!event.repeat) flip(); } });
  if (cards.length > 1) {
    const nav = document.createElement('nav'); nav.className = 'navigation'; nav.setAttribute('aria-label', 'Choose a card');
    for (const [label, offset] of [['Previous', -1], ['Next', 1]]) { const button = document.createElement('button'); button.textContent = label; button.addEventListener('click', () => { index = (index + offset + cards.length) % cards.length; render(); }); nav.append(button); }
    document.querySelector('footer').before(nav);
  }
  render();
})();
